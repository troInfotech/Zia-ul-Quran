<!DOCTYPE html>
<html lang="ur" dir="rtl" class="js-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Jamia Chishtia Razvia Zia-ul-Quran</title>
  <script>
    (function () {
      var l = localStorage.getItem('language'); if (l !== 'en') l = 'ur';
      document.documentElement.lang = l; document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
      setTimeout(function () { document.documentElement.classList.remove('js-pending'); }, 1500);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/images/jamia-logo.png">
</head>
<body data-page="contact" data-title="titleContact">
  <div id="site-header"></div>

  <header class="page-header">
    <h1 data-translate="contactTitle">Contact Us</h1>
    <p data-translate="contactSubtitle">We would be glad to hear from you</p>
  </header>

  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-item">
          <div class="icon"><i class="fas fa-location-dot"></i></div>
          <div>
            <h4 data-translate="addressLabel">Address</h4>
            <p data-translate="addressText">Cheema Plaza, Muslim Town, Shahrah-e-Quaid-e-Azam, Rahwali, Gujranwala Cantt, Punjab, Pakistan</p>
          </div>
        </div>
        <div class="contact-item">
          <div class="icon"><i class="fas fa-phone"></i></div>
          <div>
            <h4 data-translate="phoneLabel">Phone</h4>
            <p>
              <a data-site-link="phone" href="#"><bdi dir="ltr">+92 321 6404172</bdi></a><br>
              <a data-site-link="phone2" href="#"><bdi dir="ltr">+92 321 6422960</bdi></a>
            </p>
          </div>
        </div>
        <div class="contact-item">
          <div class="icon"><i class="fas fa-user-tie"></i></div>
          <div>
            <h4 data-translate="adminLabel">Principal</h4>
            <p data-translate="currentName">Prof. Hafiz Muhammad Saeed Ahmad Chishti</p>
          </div>
        </div>
        <div class="contact-item">
          <div class="icon"><i class="fas fa-globe"></i></div>
          <div>
            <h4 data-translate="socialLabel">Online</h4>
            <p>
              <a data-site-link="facebook" href="#" target="_blank" rel="noopener" data-translate="facebook">Facebook</a><br>
              <a data-site-link="youtube" href="#" target="_blank" rel="noopener" data-translate="youtube">YouTube</a>
            </p>
          </div>
        </div>
      </div>

      <iframe id="mapFrame" class="map-frame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <p style="text-align: center; margin-top: 24px;">
        <a id="directionsLink" href="#" target="_blank" rel="noopener" class="btn btn--green"><i class="fas fa-diamond-turn-right"></i> <span data-translate="getDirections">Get Directions</span></a>
      </p>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
